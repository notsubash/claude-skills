name: CLI bug
description: The `skills` command failed, did the wrong thing, or changed files it shouldn't have.
title: "cli: "
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: skills add craft-core --local
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output. Run `skills doctor` too and paste it here.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS and shell
      options: [Windows / PowerShell, Windows / cmd, Windows / Git Bash, macOS / zsh, macOS / bash, Linux / bash, Linux / zsh, Linux / fish, Other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`skills --version`, `claude --version`, `node --version`"
    validations:
      required: true
