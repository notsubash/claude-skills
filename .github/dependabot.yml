# Keeps the pinned GitHub Actions current. Free on public repos.
# Actions are pinned to full commit SHAs (a tag can be moved to malicious code; a SHA can't).
# Dependabot opens a PR that bumps the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Same supply-chain rule as the dep-upgrade skill: let a release age 7 days
    # before taking it, so a compromised release is usually caught and pulled first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [dependencies]
